<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
<title id="title">Tanishq Sonawane — Software, Cloud, AI and Automation</title>
<desc id="desc">A dark navy portfolio banner with blue and violet accents, a subtle grid, and a code window illustration.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset="1" stop-color="#172341"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#6ce5db"/><stop offset="1" stop-color="#9b92ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#6762b7" stop-opacity=".25"/><stop offset="1" stop-color="#6762b7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c7d2fe" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="320" rx="20" fill="url(#bg)"/>
<rect width="1280" height="320" rx="20" fill="url(#grid)"/>
<ellipse cx="1060" cy="110" rx="360" ry="280" fill="url(#glow)"/>
