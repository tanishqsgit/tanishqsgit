<text x="50" y="166" fill="#f4f6ff" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Tanishq Sonawane</text>
<text x="54" y="211" fill="#b6c4dc" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="2">SOFTWARE / CLOUD / AI / AUTOMATION</text>
<path d="M54 258H750" stroke="#334363" stroke-width="1"/>
<text x="54" y="284" fill="#8193b4" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".6">Ideas into useful tools. Curiosity into working projects.</text>
